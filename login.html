<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - PopIce ERP</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="brand big">🥤 PopIce ERP</div>
    <p class="muted">Sistem ERP Toko Pop Ice & Jajanan</p>
    <form id="loginForm">
      <label>Email</label>
      <input id="email" type="email" required placeholder="admin@email.com">
      <label>Password</label>
      <input id="password" type="password" required placeholder="••••••••">
      <button class="primary-btn full" type="submit">Masuk</button>
      <p id="loginError" class="error"></p>
    </form>
  </div>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
