<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PopIce ERP</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">🥤 <span>PopIce ERP</span></div>
      <nav>
        <button data-page="dashboard" class="nav-item active">🏠 Dashboard</button>
        <button data-page="pos" class="nav-item">💰 Kasir / POS</button>
        <button data-page="products" class="nav-item">🍹 Produk</button>
        <button data-page="inventory" class="nav-item">📦 Stok</button>
        <button data-page="purchases" class="nav-item">🛒 Pembelian</button>
        <button data-page="finance" class="nav-item">💵 Keuangan</button>
        <button data-page="reports" class="nav-item">📊 Laporan</button>
      </nav>
      <div class="sidebar-bottom">
        <div id="userEmail" class="muted"></div>
        <button id="logoutBtn" class="danger-btn">Keluar</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn">☰</button>
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <div class="muted" id="today"></div>
        </div>
      </header>
      <section id="pageContent" class="content"></section>
    </main>
  </div>

  <div id="toast"></div>
  <div id="modalRoot"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
